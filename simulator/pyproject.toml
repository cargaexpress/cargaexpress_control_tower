[project]
name = "carrier-webhook-simulator"
version = "1.0.0"
description = "Simulador de webhooks (push) de 5 transportadoras Tipo A - CargaExpress"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# Servicio independiente: se ejecuta con "python -m webhook_simulator", no se instala como paquete.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
