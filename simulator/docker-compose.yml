# Simulador de webhooks (HU-17 / RIWI-86). Independiente del docker-compose.yml del backend.
#
#   docker compose up --build                 simulador + receptor de pruebas (sink)
#   docker compose run --rm tests             pruebas automáticas
#   docker compose run --rm simulator --dry-run --max-events 10   ver mensajes sin enviar
#
# Para apuntar a un backend que corre en tu máquina (puerto 8000), crea un .env con:
#   SIM_TARGET_URL_TEMPLATE=http://host.docker.internal:8000/webhooks/{carrier}

name: webhook-simulator

services:
  sink:
    build:
      context: .
      target: runtime
    image: carrier-webhook-sink:local
    command: ["python", "-m", "webhook_simulator.sink", "--port", "9000"]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build:
      context: .
      target: runtime
    image: carrier-webhook-simulator:local
    depends_on:
      sink:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SIM_TARGET_URL_TEMPLATE: ${SIM_TARGET_URL_TEMPLATE:-http://sink:9000/webhooks/{carrier}}
      SIM_CARRIERS: ${SIM_CARRIERS:-alpha,beta,gamma,delta,epsilon}
      SIM_RATE: ${SIM_RATE:-5}
      SIM_SHIPMENTS_PER_BATCH: ${SIM_SHIPMENTS_PER_BATCH:-20}
      SIM_MAX_EVENTS: ${SIM_MAX_EVENTS:-0}
      SIM_DUPLICATE_RATE: ${SIM_DUPLICATE_RATE:-0.10}
      SIM_OUT_OF_ORDER_RATE: ${SIM_OUT_OF_ORDER_RATE:-0.10}
      SIM_DUPLICATE_MAX_DELAY: ${SIM_DUPLICATE_MAX_DELAY:-5}
      SIM_SEED: ${SIM_SEED:-}
      SIM_DRY_RUN: ${SIM_DRY_RUN:-false}
      SIM_REQUEST_TIMEOUT: ${SIM_REQUEST_TIMEOUT:-5}
    restart: "no"

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
