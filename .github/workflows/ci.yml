name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cargaexpress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cargaexpress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/cargaexpress_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/cargaexpress_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Check lint
        run: uv run ruff check --config pyproject.toml app tests ../simulators ../tests ../scripts
      - name: Check formatting
        run: uv run ruff format --config pyproject.toml --check app tests ../simulators ../tests ../scripts
      - name: Type-check backend
        run: uv run mypy app
      - name: Migrate and verify schema
        run: uv run alembic upgrade head && uv run alembic check
      - name: Test with coverage
        run: uv run pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80 tests ../tests
