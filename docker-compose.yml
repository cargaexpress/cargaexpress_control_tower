# Backend (FastAPI) + PostgreSQL con un solo comando:
#   cp .env.example .env     (y editar las credenciales)
#   docker compose up
#
# Las credenciales NO están escritas aquí: se leen del archivo .env

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-cargaexpress}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cargaexpress

  backend:
    pull_policy: build
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Runtime Python packages installed by the Dockerfile via uv from
    # pyproject.toml/uv.lock: fastapi, uvicorn[standard], sqlalchemy[asyncio],
    # asyncpg, alembic, pydantic-settings. Keep the manifest as source of truth.
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SQL_ECHO: ${SQL_ECHO:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      STATE_MAPPING_CACHE_TTL_SECONDS: ${STATE_MAPPING_CACHE_TTL_SECONDS:-300}
      # El host es "db" (nombre del servicio en la red de Docker), no "localhost"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Falta POSTGRES_USER}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cargaexpress}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cargaexpress

  test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      APP_ENV: ${APP_ENV:-development}
      SQL_ECHO: ${SQL_ECHO:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      STATE_MAPPING_CACHE_TTL_SECONDS: ${STATE_MAPPING_CACHE_TTL_SECONDS:-300}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Falta POSTGRES_USER}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@test-db:5432/cargaexpress_test
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Falta POSTGRES_USER}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@test-db:5432/cargaexpress_test
    command: ["sh", "-c", "alembic downgrade base && alembic upgrade head && python -m pytest -v"]
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - cargaexpress

  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: cargaexpress_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cargaexpress
  rabbitmq:
    image: rabbitmq:management
    container_name: cargaexpress_rabbitmq
    restart: unless-stopped
    ports:
      # Puerto de protocolo AMQP (para FastAPI, workers, Airflow)
      - "5672:5672"
      # Puerto de la interfaz web de administración (UI)
      - "15672:15672"
    environment:
      # Credenciales por defecto (en producción pásalas por archivo .env)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      # Nombre de nodo explícito para garantizar persistencia asociada
      RABBITMQ_NODENAME: rabbit@cargaexpress_rabbitmq
    volumes:
      # Persistencia de colas, exchanges y mensajes persistentes
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cargaexpress


networks:
  cargaexpress:

volumes:
  postgres_data:
  rabbitmq_data:
    driver: local
